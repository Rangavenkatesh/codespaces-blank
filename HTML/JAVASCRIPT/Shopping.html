<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TECHNO SHOP</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .product-img {
            height: 150px;
            object-fit: contain;
            padding: 10px;
        }
    </style>
</head>

<body class="bg-light">
    <!-- Header -->
    <div class="bg-primary text-white py-3 text-center mb-4">
        <h2>TECHNO SHOP</h2>
    </div>

    <div class="container">
        <div class="row">

            <!-- Products Column -->
            <div class="col-md-8">
                <div class="row g-3">

                    <!-- Milk -->
                    <div class="col-sm-6 col-md-4">
                        <div class="card text-center h-100">
                            <img src="https://5.imimg.com/data5/SELLER/Default/2023/5/311999399/TC/OE/GL/81680101/milk-pouch-1000x1000.jpg"
                                class="product-img card-img-top" alt="Milk">
                            <div class="card-body">
                                <h6>Milk</h6>
                                <p class="text-muted">₹40</p>
                                <button class="btn btn-primary btn-sm" onclick="addToCart('Milk', 40)">Add to
                                    Cart</button>
                            </div>
                        </div>
                    </div>

                    <!-- Bread -->
                    <div class="col-sm-6 col-md-4">
                        <div class="card text-center h-100">
                            <img src="https://d22qhov8mohr82.cloudfront.net/990198_BRITANNIA_100_WHOLE_WHEAT_BREAD_450_G_LR_1_640675e2f4.png"
                                class="product-img card-img-top" alt="Bread">
                            <div class="card-body">
                                <h6>Bread</h6>
                                <p class="text-muted">₹30</p>
                                <button class="btn btn-primary btn-sm" onclick="addToCart('Bread', 30)">Add to
                                    Cart</button>
                            </div>
                        </div>
                    </div>

                    <!-- Eggs -->
                    <div class="col-sm-6 col-md-4">
                        <div class="card text-center h-100">
                            <img src="https://png.pngtree.com/png-clipart/20250418/original/pngtree-egg-tray-png-image_20723396.png"
                                class="product-img card-img-top" alt="Eggs">
                            <div class="card-body">
                                <h6>Eggs</h6>
                                <p class="text-muted">₹60</p>
                                <button class="btn btn-primary btn-sm" onclick="addToCart('Eggs', 60)">Add to
                                    Cart</button>
                            </div>
                        </div>
                    </div>

                    <!-- Chips -->
                    <div class="col-sm-6 col-md-4">
                        <div class="card text-center h-100">
                            <img src="https://m.media-amazon.com/images/S/aplus-media-library-service-media/3f3e9f10-3b14-4bad-a7fe-289b3ae95d1a.__CR0,0,970,600_PT0_SX970_V1___.jpg"
                                class="product-img card-img-top" alt="Chips">
                            <div class="card-body">
                                <h6>Chips</h6>
                                <p class="text-muted">₹50</p>
                                <button class="btn btn-primary btn-sm" onclick="addToCart('Chips', 50)">Add to
                                    Cart</button>
                            </div>
                        </div>
                    </div>

                    <!-- Rice Bag -->
                    <div class="col-sm-6 col-md-4">
                        <div class="card text-center h-100">
                            <img src="https://5.imimg.com/data5/SELLER/Default/2022/4/CF/FQ/BC/148970923/maharshi-25kg-premium-sona-masoori-rice-bag-1000x1000.jpg"
                                class="product-img card-img-top" alt="Rice Bag">
                            <div class="card-body">
                                <h6>Rice Bag</h6>
                                <p class="text-muted">₹2499</p>
                                <button class="btn btn-primary btn-sm" onclick="addToCart('Rice Bag', 2499)">Add to
                                    Cart</button>
                            </div>
                        </div>
                    </div>

                    <!-- All Out -->
                    <div class="col-sm-6 col-md-4">
                        <div class="card text-center h-100">
                            <img src="https://cdn.zeptonow.com/production/ik-seo/tr:w-470,ar-1080-1080,pr-true,f-auto,q-40,dpr-2/cms/product_variant/be932983-a3fd-48d6-a4f9-19edba06e9ad/All-Out-Ultra-1-Slider-Machine-2-Refills-Mosquito-Repellent.jpeg"
                                class="product-img card-img-top" alt="All Out">
                            <div class="card-body">
                                <h6>All Out</h6>
                                <p class="text-muted">₹180</p>
                                <button class="btn btn-primary btn-sm" onclick="addToCart('All Out', 180)">Add to
                                    Cart</button>
                            </div>
                        </div>
                    </div>

                    <!-- Sugar -->
                    <div class="col-sm-6 col-md-4">
                        <div class="card text-center h-100">
                            <img src="https://www.pngitem.com/pimgs/m/286-2867603_uttam-sulphurless-sugar-5kg-hd-png-download.png"
                                class="product-img card-img-top" alt="Sugar">
                            <div class="card-body">
                                <h6>Sugar</h6>
                                <p class="text-muted">₹40</p>
                                <button class="btn btn-primary btn-sm" onclick="addToCart('Sugar', 40)">Add to
                                    Cart</button>
                            </div>
                        </div>
                    </div>

                    <!-- NEW ITEM 1: Biscuits -->
                    <div class="col-sm-6 col-md-4">
                        <div class="card text-center h-100">
                            <img src="https://images.unsplash.com/photo-1558961363-fa8fdf82db35?w=300"
                                class="product-img card-img-top" alt="Biscuits">
                            <div class="card-body">
                                <h6>Biscuits</h6>
                                <p class="text-muted">₹25</p>
                                <button class="btn btn-primary btn-sm" onclick="addToCart('Biscuits', 25)">Add to
                                    Cart</button>
                            </div>
                        </div>
                    </div>

                    <!-- NEW ITEM 2: Apples -->
                    <div class="col-sm-6 col-md-4">
                        <div class="card text-center h-100">
                            <img src="https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=300"
                                class="product-img card-img-top" alt="Apples">
                            <div class="card-body">
                                <h6>Apples (1kg)</h6>
                                <p class="text-muted">₹120</p>
                                <button class="btn btn-primary btn-sm" onclick="addToCart('Apples', 120)">Add to
                                    Cart</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
            <!-- Cart Column -->
            <div class="col-md-4 mt-4 mt-md-0">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h5 class="m-0">Your Cart</h5>
                    </div>
                    <div class="card-body">
                        <ul id="cart-items" class="list-group mb-3"></ul>
                        <h5>Total: ₹<span id="cart-total">0</span></h5>
                        <button class="btn btn-success w-100 mt-2" onclick="checkout()">Checkout</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let cart = {};

        function addToCart(product, price) {
            if (!cart[product]) {
                cart[product] = { price: price, quantity: 1 };
            } else {
                cart[product].quantity++;
            }
            displayCart();
        }

        function increaseQuantity(product) {
            cart[product].quantity++;
            displayCart();
        }

        function decreaseQuantity(product) {
            cart[product].quantity--;
            if (cart[product].quantity <= 0) {
                delete cart[product];
            }
            displayCart();
        }

        function displayCart() {
            const cartItems = document.getElementById("cart-items");
            cartItems.innerHTML = "";
            let total = 0;

            for (let product in cart) {
                let item = cart[product];
                total += item.price * item.quantity;

                cartItems.innerHTML += `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <b>${product}</b><br>
                            <small>₹${item.price} × ${item.quantity}</small>
                        </div>
                        <div>
                            <button class="btn btn-sm btn-success" onclick="increaseQuantity('${product}')">+</button>
                            <button class="btn btn-sm btn-danger" onclick="decreaseQuantity('${product}')">−</button>
                        </div>
                    </li>`;
            }

            document.getElementById("cart-total").innerText = total;
        }
    </script>
</body>

</html>
